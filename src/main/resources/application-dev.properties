spring.config.import=optional:file:${user.home}/apps/flashcards/application-dev.properties
# H2 Konfiguration für Entwicklungsumgebung (Profil: default)
spring.datasource.url=jdbc:h2:file:./flashcardsdb;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9090
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Flyway Konfiguration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/dev-migration
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true